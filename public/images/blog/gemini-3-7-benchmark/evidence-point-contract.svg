<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">From model-guessed intervals to model-authored evidence points</title>
  <desc id="desc">The old contract asks a model to invent a start and end for every observation. The new contract asks for one source-time point where the model claims the observation is visible; BitterClip may derive a separate dotted navigation range that is explicitly not evidence of action duration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e7"/>
      <stop offset="1" stop-color="#ede5d5"/>
    </linearGradient>
    <marker id="badArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d76355"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="65" fill="#27241f" font-size="31" font-weight="780">Ask for one moment the system can check</text>
    <text x="60" y="101" fill="#716a5f" font-size="17">A claimed visual moment can be verified. A convenient playback range is navigation.</text>

    <g transform="translate(60 145)">
      <rect width="510" height="405" rx="22" fill="#fffaf0" stroke="#cfc4b2"/>
      <text x="28" y="42" fill="#8d493f" font-size="14" font-weight="760" letter-spacing="1.6">OLD QUESTION</text>
      <text x="28" y="79" fill="#292620" font-size="25" font-weight="760">“When did it start and end?”</text>
      <text x="28" y="113" fill="#756f64" font-size="15">Two model-authored numbers per row</text>
      <line x1="50" y1="190" x2="460" y2="190" stroke="#9e978b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="145" cy="190" r="8" fill="#f0bc65"/>
      <circle cx="365" cy="190" r="8" fill="#dc6a58"/>
      <path d="M365 178C315 122 202 122 145 178" fill="none" stroke="#d76355" stroke-width="7" stroke-linecap="round" marker-end="url(#badArrow)"/>
      <text x="124" y="224" fill="#5c574e" font-size="15">20.8</text>
      <text x="347" y="224" fill="#5c574e" font-size="15">146.0</text>
      <rect x="45" y="264" width="420" height="58" rx="14" fill="#f5ddd5"/>
      <text x="255" y="289" fill="#8d493f" font-size="15" font-weight="730" text-anchor="middle">Valid numbers, impossible relationship</text>
      <text x="255" y="311" fill="#a06458" font-size="13" text-anchor="middle">The schema bounds each field, not the story between them.</text>
      <text x="28" y="372" fill="#91897c" font-size="13">Failure mode: end before start, overlapping rows,</text>
      <text x="28" y="392" fill="#91897c" font-size="13">or a later observation that jumps backward in time.</text>
    </g>

    <g transform="translate(630 145)">
      <rect width="510" height="405" rx="22" fill="#18231b" stroke="#435849"/>
      <text x="28" y="42" fill="#96c69b" font-size="14" font-weight="760" letter-spacing="1.6">BETTER QUESTION</text>
      <text x="28" y="79" fill="#f7f4eb" font-size="25" font-weight="760">“Where can you see it?”</text>
      <text x="28" y="113" fill="#aeb8ab" font-size="15">One source-time point, checked before repair</text>
      <line x1="50" y1="190" x2="460" y2="190" stroke="#778478" stroke-width="5" stroke-linecap="round"/>
      <rect x="172" y="165" width="170" height="50" rx="25" fill="none" stroke="#d9b769" stroke-width="3" stroke-dasharray="7 8"/>
      <circle cx="257" cy="190" r="13" fill="#f0c56e" stroke="#fff8e7" stroke-width="4"/>
      <text x="257" y="238" fill="#f0c56e" font-size="17" font-weight="760" text-anchor="middle">146.0 seconds</text>
      <g transform="translate(45 266)">
        <circle cx="10" cy="10" r="8" fill="#f0c56e"/>
        <text x="30" y="15" fill="#f2eee4" font-size="15" font-weight="700">Model claim: visible here</text>
        <rect x="2" y="46" width="16" height="12" rx="6" fill="none" stroke="#d9b769" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="30" y="57" fill="#f2eee4" font-size="15" font-weight="700">Host navigation: nearby playback</text>
      </g>
      <rect x="45" y="348" width="420" height="37" rx="18.5" fill="#26372a"/>
      <text x="255" y="372" fill="#bcd0bc" font-size="13" font-weight="720" text-anchor="middle">Navigation does not prove action duration.</text>
    </g>

    <text x="600" y="606" fill="#625d54" font-size="15" font-weight="680" text-anchor="middle">The point contract removes one contradiction. Raw order still has to be checked.</text>
  </g>
</svg>
