<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gemini 3.7 benchmark decision</title>
  <desc id="desc">Gemini 3.7 had 47.4 percent lower provider-attempt latency and 19.9 percent lower mean paired estimated cost in the offline comparison, but its production canary failed BitterClip's temporal-grounding gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8b36a"/>
      <stop offset="1" stop-color="#f28f84"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="190" fill="#f28f84" opacity="0.08" filter="url(#glow)"/>
  <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200" stroke="#ffffff" stroke-opacity="0.035"/>
  <path d="M160 0V630M320 0V630M480 0V630M640 0V630M800 0V630M960 0V630" stroke="#ffffff" stroke-opacity="0.025"/>

  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="72" y="70" fill="#f28f84" font-size="18" font-weight="600" letter-spacing="3">BITTERCLIP FIELD TEST</text>
    <text x="72" y="125" fill="#ffffff" font-size="45" font-weight="750">Lower latency offline.</text>
    <text x="72" y="176" fill="#ffffff" font-size="45" font-weight="750">Rejected by the production gate.</text>

    <g transform="translate(72 230)">
      <rect width="315" height="190" rx="22" fill="#111111" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="26" y="42" fill="#a1a1aa" font-size="16" letter-spacing="1.5">OFFLINE LATENCY</text>
      <text x="26" y="111" fill="url(#coral)" font-size="58" font-weight="750">-47.4%</text>
      <text x="26" y="151" fill="#d4d4d8" font-size="17">69 matched pairs</text>
      <text x="26" y="174" fill="#71717a" font-size="14">provider attempt only</text>
    </g>

    <g transform="translate(410 230)">
      <rect width="315" height="190" rx="22" fill="#111111" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="26" y="42" fill="#a1a1aa" font-size="16" letter-spacing="1.5">ESTIMATED COST</text>
      <text x="26" y="111" fill="url(#coral)" font-size="58" font-weight="750">-19.9%</text>
      <text x="26" y="151" fill="#d4d4d8" font-size="17">same temporary tariff</text>
      <text x="26" y="174" fill="#71717a" font-size="14">observed usage mix</text>
    </g>

    <g transform="translate(748 230)">
      <rect width="380" height="190" rx="22" fill="#241716" stroke="#f28f84" stroke-opacity="0.55"/>
      <text x="26" y="42" fill="#f2aaa1" font-size="16" letter-spacing="1.5">PRODUCTION CANARY</text>
      <text x="26" y="105" fill="#ffffff" font-size="46" font-weight="750">FAILED</text>
      <text x="26" y="145" fill="#f4d5d1" font-size="17">invalid chunk-local times</text>
      <text x="26" y="171" fill="#b98983" font-size="14">0 annotations promoted</text>
    </g>

    <path d="M72 480H1128" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="72" y="523" fill="#d4d4d8" font-size="18">Decision: keep Gemini 3.6 as BitterClip's production default.</text>
    <text x="72" y="558" fill="#8b8b94" font-size="15">The wider confirmation suite missed the repeatability gate: 0.320 observed vs 0.850 required.</text>
    <text x="72" y="594" fill="#71717a" font-size="13">One real two-camera lesson · 15 windows · 23 witness excerpts · 3 repeats · one non-promoting production canary</text>
  </g>
</svg>
