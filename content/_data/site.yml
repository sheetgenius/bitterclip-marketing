# Global facts that recur everywhere. Read by SignupCta, AssistantConnectionIntro,
# SupportContact, and meta/og defaults. Public acquisition enters through Creator;
# pricing_url points to the canonical current offer rather than duplicating it here.
# Values below are VERIFIED against the product repo (config/routes.rb: the sign_up and
# mcp routes) and the existing marketing pages (index.vue's #pricing section, icon.png).
signup_url: https://app.bitterclip.com/sign_up?plan=clip
# Pricing lives on the marketing homepage's pricing section (the #pricing anchor used
# by the site nav); there is no separate /pricing page or app-side pricing route.
pricing_url: https://bitterclip.com/#pricing
support_email: hello@bitterclip.com
# BitterClip is a product of SheetGenius, Inc.; the company keeps a BitterClip
# support page that links back into these docs. Cross-linked, not duplicated.
company_url: https://company.sheetgenius.com/
company_support_url: https://company.sheetgenius.com/bitterclip/support/
mcp_resource_url: https://app.bitterclip.com/mcp
# Opens Claude's "Add custom connector" window with BitterClip's name and address
# filled in; the visitor clicks Continue. Verified in claude.ai on 2026-09-23.
claude_connector_add_url: https://claude.ai/customize/connectors?modal=add-custom-connector&connectorName=BitterClip&connectorUrl=https%3A%2F%2Fapp.bitterclip.com%2Fmcp
app_origin: https://app.bitterclip.com
# Default 1200x630 social card for marketing and docs routes.
og_image_default: /images/bitterclip-og-iso4.png
